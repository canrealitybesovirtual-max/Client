# Render Blueprint for the hosted TradeComply CA platform (web app + API + MCP at /mcp).
# Customer data: set DATABASE_URL to a PostgreSQL database (Supabase pooler or Render Postgres; see README,
# "Durable storage (Postgres)") and it lives there, safe across deploys and restarts. Without DATABASE_URL the app
# uses SQLite in DATA_DIR, which only survives on the persistent disk below. /health reports "storage" and
# "storage_persistent". The disk also keeps the CSLB license data (rebuilt from seed/ at boot if missing) and, when
# SECRET_KEY is not set, the signing key (with Postgres that key is kept in the database instead).
# Disks need a paid instance type and limit the service to one instance, which this app expects (rate limits and
# the tool-list cache are in memory). With DATABASE_URL set, the disk block can be removed: remove the DATA_DIR entry
# with it (the app then uses ./data in the checkout) or point DATA_DIR at a writable directory, because without the
# disk /var/data may not exist or be writable and the app would fail to start creating it.
services:
  - type: web
    name: tradecomply-ca
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: tradecomply-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        sync: false           # postgresql://... (Supabase Session/Transaction pooler, IPv4) or Render Postgres; blank = SQLite
      - key: APP_URL
        sync: false           # public https base URL of this service, e.g. https://app.your-company.example (blank =
                              # Render's own onrender.com address). Set it before registering OAuth/SSO redirect URIs
                              # or handing out MCP and calendar links: they are built from it
      - key: SUPPORT_EMAIL
        sync: false           # the operator's support address shown to customers ("contact support"); blank = "ask
                              # whoever runs this TradeComply server". Use a business address, not a personal one
      - key: SUPPORT_URL
        sync: false           # the operator's support or contact page (https://...); blank = none
      - key: MAIL_FROM
        sync: false           # sender of invites, password reset links and email confirmations, e.g.
                              # "TradeComply <no-reply@your-company.example>"; blank = no email (owners copy links)
      - key: POSTMARK_SERVER_TOKEN
        sync: false           # Postmark server token (HTTPS). Render's free plan blocks SMTP ports 25/465/587; on a
                              # paid plan SMTP_HOST/SMTP_PORT/SMTP_SECURITY/SMTP_USERNAME/SMTP_PASSWORD work instead
      - key: ANTHROPIC_API_KEY
        sync: false           # Ask TradeComply, the in-app AI helper (docs/ai-helper.md); blank = helper hidden.
                              # Never set ANTHROPIC_LOG=debug here: the SDK would log what people type
      - key: CSLB_AUTO_DOWNLOAD
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: INTEGRATIONS_KEY
        generateValue: true   # AES-256-GCM key for integration secrets at rest (Render generates base64 of 256 bits)
      - key: TRUSTED_PROXY_HOPS
        value: "2"            # Render's edge (Cloudflare, then one more Render proxy) appends 2 X-Forwarded-For entries:
                              # "<what the client sent>, <client address>, <proxy address that changes per request>".
                              # 2 = the client address, which no client can set. Not 0 (the first entry, which the
                              # client chooses) and not 1 (a proxy address shared by many customers). Measured on the
                              # live service on 2026-11-27 (README, TRUSTED_PROXY_HOPS); check again after Render
                              # changes its network
      - key: MCP_PUBLIC_DEMO
        value: "0"            # On Render /mcp needs an API key unless this is "1" (anonymous demo, audited and
                              # throttled). MCP_REQUIRE_KEY=0 no longer opens it here. docs/mcp-security.md
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false           # the $1,000/month recurring price id (price_...)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false           # from the webhook endpoint https://<host>/api/billing/webhook
