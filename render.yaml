# Render Blueprint for the hosted TradeComply CA platform (web app + API + MCP at /mcp).
# Customer data: set DATABASE_URL to a PostgreSQL database (Supabase pooler or Render Postgres; see README,
# "Durable storage (Postgres)") and it lives there, safe across deploys and restarts. Without DATABASE_URL the app
# uses SQLite in DATA_DIR, which only survives on the persistent disk below. /health reports "storage" and
# "storage_persistent". The disk also keeps the CSLB license data (rebuilt from seed/ at boot if missing) and, when
# SECRET_KEY is not set, the signing key (with Postgres that key is kept in the database instead).
# Disks need a paid instance type and limit the service to one instance, which this app expects (rate limits and
# the tool-list cache are in memory). With DATABASE_URL set, the disk block can be removed: remove the DATA_DIR entry
# with it (the app then uses ./data in the checkout) or point DATA_DIR at a writable directory, because without the
# disk /var/data may not exist or be writable and the app would fail to start creating it.
services:
  - type: web
    name: tradecomply-ca
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: tradecomply-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.1"
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        sync: false           # postgresql://... (Supabase Session/Transaction pooler, IPv4) or Render Postgres; blank = SQLite
      - key: CSLB_AUTO_DOWNLOAD
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: MCP_REQUIRE_KEY
        value: "0"            # "1" once customers use their own API keys; "0" keeps the public MCP demo open
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false           # the $1,000/month recurring price id (price_...)
      - key: STRIPE_WEBHOOK_SECRET
        sync: false           # from the webhook endpoint https://<host>/api/billing/webhook
